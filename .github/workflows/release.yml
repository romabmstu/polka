name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash turns on pipefail, so `cmd | tee log` fails when cmd fails.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Test
        run: swift test --package-path Packages/PolkaKit

      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          version="${GITHUB_REF_NAME#v}"
          xcodebuild -project Polka.xcodeproj -scheme Polka -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY=- build

      - name: Package
        run: |
          app="build/Build/Products/Release/Polka.app"
          ditto -c -k --keepParent "$app" "Polka-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Polka-${GITHUB_REF_NAME}.zip" > "Polka-${GITHUB_REF_NAME}.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: Polka-${{ github.ref_name }}.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Polka-${GITHUB_REF_NAME}.zip" "Polka-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Polka ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
