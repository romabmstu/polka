name: Polka

options:
  bundleIdPrefix: io.github.romabmstu
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  PolkaKit:
    path: Packages/PolkaKit

targets:
  Polka:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Info.plist
        buildPhase: none
      - path: App/Polka.entitlements
        buildPhase: none
      - path: Vendor/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: PolkaKit
        product: PolkaCore
      - package: PolkaKit
        product: PolkaSystem
      # Loaded by /usr/bin/perl at run time, never linked into Polka.
      - target: MediaRemoteAdapter
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Polka
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romabmstu.Polka
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Polka.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Translation exists from macOS 15; weak so Polka still launches on 14.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "Translation"]

  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter/src
      - path: Vendor/MediaRemoteAdapter/include
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romabmstu.Polka.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        USE_HEADERMAP: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/MediaRemoteAdapter/src
          - $(SRCROOT)/Vendor/MediaRemoteAdapter/include
        OTHER_LDFLAGS:
          - -framework
          - Foundation
          - -framework
          - AppKit
          - -framework
          - UniformTypeIdentifiers
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES

schemes:
  Polka:
    build:
      targets:
        Polka: all
    run:
      config: Debug
    archive:
      config: Release
