name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash turns on pipefail, so `cmd | tee log` fails when cmd fails.
        shell: bash
    outputs:
      build: ${{ steps.number.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Build number
        id: number
        # Commit count on main: always increases, so newer builds compare greater.
        run: echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: swift test --package-path Packages/PolkaKit 2>&1 | tee test.log

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build app
        id: build
        continue-on-error: true
        run: |
          xcodebuild -project Polka.xcodeproj -scheme Polka -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            CURRENT_PROJECT_VERSION=${{ steps.number.outputs.build }} \
            CODE_SIGN_IDENTITY=- -quiet build 2>&1 | tee build.log

      - name: Report errors
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          set +eo pipefail
          errors=$(cat test.log build.log 2>/dev/null | grep -aE ':[0-9]+:[0-9]+: error: ' | sed "s#$GITHUB_WORKSPACE/##g" | sort -u)
          count=$(printf '%s\n' "$errors" | grep -c .)
          encode() { sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=${count} compiler errors::$(printf '%s\n' "$errors" | head -80 | encode)"
          failed=$(grep -aE '✘|recorded an issue|error: -\[' test.log 2>/dev/null | head -40 | encode)
          if [ -n "$failed" ]; then echo "::warning title=Test failures::$failed"; fi
          exit 0

      - name: Summary
        if: always()
        run: |
          tests=$(grep -aE 'Test run with|Executed [0-9]+ tests' test.log 2>/dev/null | tail -2 | tr -d ':' | tr '\n' ' ')
          echo "::notice title=Tests::${tests:-no summary} (outcome: ${{ steps.tests.outcome }})"
          echo "::notice title=Build::build ${{ steps.number.outputs.build }}, outcome: ${{ steps.build.outcome }}"

      - name: Check Homebrew cask
        run: ruby -c Casks/polka.rb

      - name: Verify app bundle
        if: steps.build.outcome == 'success'
        run: |
          app=build/Build/Products/Release/Polka.app
          size=$(du -sh "$app" | cut -f1)
          archs=$(lipo -archs "$app/Contents/MacOS/Polka" 2>/dev/null || echo "no executable")
          adapter=$(test -d "$app/Contents/Frameworks/MediaRemoteAdapter.framework" && echo yes || echo missing)
          echo "::notice title=App bundle::size $size, archs $archs, media adapter $adapter"
          test -x "$app/Contents/MacOS/Polka"
          test -f "$app/Contents/Resources/mediaremote-adapter.pl"
          codesign --verify --deep --strict "$app"
          # Frameworks newer than the deployment target must be weak, or Polka
          # would not even launch on the oldest supported macOS.
          if otool -l "$app/Contents/MacOS/Polka" | grep -A2 'LC_LOAD_DYLIB$' | grep -q 'Translation.framework'; then
            echo "::error title=Strong link::Translation.framework must be weak-linked for macOS 14"
            exit 1
          fi
          ditto -c -k --keepParent "$app" Polka.zip

      - name: Launch smoke test
        # Catches crashes at startup before a build reaches anyone: the app
        # must still be running 20 seconds after launch.
        if: steps.build.outcome == 'success'
        run: |
          app=build/Build/Products/Release/Polka.app
          defaults write io.github.romabmstu.Polka hasSeenWelcome -bool true
          defaults write io.github.romabmstu.Polka checkForUpdatesAutomatically -bool false
          "$app/Contents/MacOS/Polka" > launch.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            wait "$pid" 2>/dev/null || true
            echo "::notice title=Launch::Polka ran for 20 seconds without crashing"
            exit 0
          fi
          status=0
          wait "$pid" || status=$?
          report=$(ls -t ~/Library/Logs/DiagnosticReports/Polka*.ips 2>/dev/null | head -1 || true)
          {
            echo "Exit status $status"
            tail -n 30 launch.log
            if [[ -n "$report" ]]; then head -c 4000 "$report"; fi
          } > failure.txt
          cat failure.txt
          echo "::error title=Polka quit during launch::$(awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' failure.txt)"
          exit 1

      - name: Upload build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Polka-app
          path: Polka.zip
          retention-days: 14

      - name: Result
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "tests: ${{ steps.tests.outcome }}, build: ${{ steps.build.outcome }}"
          exit 1

  beta:
    name: Publish beta build
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: beta-release
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Polka-app

      - name: Install dmgbuild
        # Only for the designed disk image; packaging falls back without it.
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --disable-pip-version-check "dmgbuild>=1.6,<2"
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"

      - name: Sign and package
        id: package
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          ditto -x -k Polka.zip .
          if ! scripts/package.sh Polka.app beta nightly out > package.log 2>&1; then
            cat package.log
            # Logs need a sign-in; annotations are visible on the run page.
            echo "::error title=Packaging failed::$(tail -n 20 package.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
            exit 1
          fi
          cat package.log

      - name: Publish
        if: steps.package.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
        run: |
          # Keep previous archives available for clients that already fetched
          # their manifest. Publish the new manifest only after its archive.
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Beta $VERSION ($BUILD)" --notes-file out/notes.txt
          fi
          gh release upload nightly out/"$NAME" out/"$NAME".sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          if [[ -f out/Polka.dmg ]]; then
            gh release upload nightly out/Polka.dmg out/Polka.dmg.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release upload nightly out/update.json --repo "$GITHUB_REPOSITORY" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit nightly --repo "$GITHUB_REPOSITORY" \
            --title "Beta $VERSION ($BUILD)" --notes-file out/notes.txt --prerelease
          echo "::notice title=Beta published::$VERSION ($BUILD)"
