name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash turns on pipefail, so `cmd | tee log` fails when cmd fails.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Versions
        run: xcodebuild -version && swift --version

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: swift test --package-path Packages/PolkaKit 2>&1 | tee test.log

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build app
        id: build
        continue-on-error: true
        run: |
          xcodebuild -project Polka.xcodeproj -scheme Polka -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY=- -quiet build 2>&1 | tee build.log

      - name: Report errors
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          set +eo pipefail
          errors=$(cat test.log build.log 2>/dev/null | grep -aE ':[0-9]+:[0-9]+: error: ' | sed "s#$GITHUB_WORKSPACE/##g" | sort -u)
          count=$(printf '%s\n' "$errors" | grep -c .)
          encode() { sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=${count} compiler errors::$(printf '%s\n' "$errors" | head -80 | encode)"
          failed=$(grep -aE '✘|recorded an issue|error: -\[' test.log 2>/dev/null | head -40 | encode)
          if [ -n "$failed" ]; then echo "::warning title=Test failures::$failed"; fi
          {
            echo '```'
            printf '%s\n' "$errors"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Summary
        if: always()
        run: |
          tests=$(grep -aE 'Test run with|Executed [0-9]+ tests|error:' test.log 2>/dev/null | tail -3 | tr -d ':' | tr '\n' ' ')
          [ -n "$tests" ] || tests="last lines: $(tail -n 3 test.log 2>/dev/null | tr -d ':' | tr '\n' ' ')"
          echo "::notice title=Tests::${tests:-no test summary} (outcome: ${{ steps.tests.outcome }})"
          echo "::notice title=Build::outcome: ${{ steps.build.outcome }}"

      - name: Verify app bundle
        id: verify
        if: steps.build.outcome == 'success'
        run: |
          app=build/Build/Products/Release/Polka.app
          ls -la "$app/Contents" "$app/Contents/MacOS" || true
          size=$(du -sh "$app" | cut -f1)
          archs=$(lipo -archs "$app/Contents/MacOS/Polka" 2>/dev/null || echo "no executable")
          echo "::notice title=App bundle::size $size, archs $archs, Info.plist $(test -f "$app/Contents/Info.plist" && echo present || echo missing)"
          test -x "$app/Contents/MacOS/Polka"
          test -f "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

      - name: Package build
        if: steps.build.outcome == 'success'
        run: ditto -c -k --keepParent build/Build/Products/Release/Polka.app Polka-${{ github.sha }}.zip

      - name: Upload build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Polka-${{ github.sha }}
          path: Polka-${{ github.sha }}.zip
          retention-days: 14

      - name: Style
        run: swift format lint --recursive App Packages

      - name: Result
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "tests: ${{ steps.tests.outcome }}, build: ${{ steps.build.outcome }}"
          exit 1
