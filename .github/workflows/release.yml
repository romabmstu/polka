name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash turns on pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Test
        run: swift test --package-path Packages/PolkaKit

      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Polka.xcodeproj -scheme Polka -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGN_IDENTITY=- -quiet build

      - name: Sign and package
        id: package
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: scripts/package.sh build/Build/Products/Release/Polka.app stable "$GITHUB_REF_NAME" out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/${{ steps.package.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/"$NAME" out/"$NAME".sha256 out/update.json \
            --title "Polka ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
