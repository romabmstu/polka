name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash turns on pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Test
        run: swift test --package-path Packages/PolkaKit

      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Polka.xcodeproj -scheme Polka -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGN_IDENTITY=- -quiet build

      - name: Sign and package
        id: package
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: scripts/package.sh build/Build/Products/Release/Polka.app stable "$GITHUB_REF_NAME" out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: out/Polka*

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The matching CHANGELOG section, or the commit subjects since the
          # previous tag when there is none.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log --format='- %s' ${previous:+"$previous.."}"$GITHUB_REF_NAME" > notes.md
          fi
          cat >> notes.md <<'NOTES'

          ### Install

          - **Homebrew:** `brew tap romabmstu/polka https://github.com/romabmstu/polka && brew install --cask romabmstu/polka/polka`
          - **Disk image:** open `Polka.dmg`, drag Polka to Applications, then run `xattr -dr com.apple.quarantine /Applications/Polka.app` once (Polka is not notarized yet).

          Already installed? Polka updates itself — no need to download this by hand.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          files=(out/"$NAME" out/"$NAME".sha256 out/update.json)
          if [[ -f out/Polka.dmg ]]; then files+=(out/Polka.dmg out/Polka.dmg.sha256); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Polka ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
