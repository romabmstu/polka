name: Polka

options:
  bundleIdPrefix: io.github.romabmstu
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  PolkaKit:
    path: Packages/PolkaKit

targets:
  Polka:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Info.plist
        buildPhase: none
      - path: App/Polka.entitlements
        buildPhase: none
    dependencies:
      - package: PolkaKit
        product: PolkaCore
      - package: PolkaKit
        product: PolkaSystem
    settings:
      base:
        PRODUCT_NAME: Polka
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romabmstu.Polka
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Polka.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Polka:
    build:
      targets:
        Polka: all
    run:
      config: Debug
    archive:
      config: Release
